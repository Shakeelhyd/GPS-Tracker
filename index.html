<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar Fleet | GPS Operations</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#0b1730;--blue:#2764e8;--cyan:#16b8c5;--ink:#17243a;--muted:#6b7890;--line:#e7ebf3;--bg:#f4f7fb;--card:#fff;--green:#159b74;--orange:#ed9d39;--red:#e45c67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:flex;min-height:100vh}.sidebar{width:242px;background:var(--navy);color:#c8d3e6;padding:27px 14px;display:flex;flex-direction:column}
.brand{font-size:20px;font-weight:800;color:#fff;padding:0 16px 27px;letter-spacing:-.03em}.brand b{color:var(--cyan)}.brand small{display:block;color:#7888a3;font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-top:7px}
nav{display:grid;gap:4px}nav button{background:transparent;border:0;color:#9eacc2;text-align:left;padding:12px 16px;border-radius:8px;font:inherit;cursor:pointer}nav button:hover,nav button.active{background:#17284b;color:#fff}nav button.active{box-shadow:inset 3px 0 var(--cyan)}
.sidebar-footer{margin-top:auto;border-top:1px solid #203251;padding:17px 16px;color:#74839d;font-size:12px}.user{display:flex;gap:10px;align-items:center;color:#fff;margin-bottom:8px}.avatar{background:#2c68d5;border-radius:50%;height:30px;width:30px;display:grid;place-items:center;font-size:12px;font-weight:700}
.main{flex:1;padding:30px 38px;max-width:1600px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--blue);font-weight:800}.title{font-size:28px;letter-spacing:-.04em;margin:4px 0 7px}.sub{color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.refresh{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer}.live{color:var(--green);font-size:12px;font-weight:700}.live:before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 14px #18325b08}.stat{padding:18px}.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.stat-value{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:10px}.stat-meta{font-size:11px;color:var(--muted);margin-top:5px}.green{color:var(--green)}.blue{color:var(--blue)}.orange{color:var(--orange)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.8fr);gap:20px}.panel{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel h2{font-size:15px;margin:0}.panel-kicker{font-size:11px;color:var(--muted)}#map{height:388px;border-radius:9px;overflow:hidden}.map-wrap{position:relative}.map-legend{position:absolute;z-index:500;left:12px;bottom:12px;background:#fff;padding:9px 11px;border-radius:7px;box-shadow:0 2px 9px #0002;font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.online{background:var(--green)}.offline{background:#aeb8c7}
.chart{height:100px;display:flex;align-items:end;gap:10px;padding:4px 2px 0}.bar{flex:1;background:linear-gradient(180deg,#3b7bf1,#a9c7ff);border-radius:4px 4px 0 0;min-height:12px;position:relative}.bar span{position:absolute;bottom:-19px;width:100%;text-align:center;color:var(--muted);font-size:10px}.chart-caption{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:27px}.device-list{display:grid;gap:7px}.device{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.device:last-child{border:0}.device-icon{width:32px;height:32px;border-radius:8px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.device-info{flex:1}.device-name{font-weight:700;font-size:13px}.device-sub{font-size:11px;color:var(--muted);margin-top:3px}.status{font-size:10px;font-weight:800;text-transform:uppercase}.status.online{color:var(--green)}.status.offline{color:#8e99a9}
.wide{grid-column:1/-1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:11px;border-bottom:1px solid var(--line)}td{padding:13px 11px;border-bottom:1px solid #f0f2f6;font-size:13px}tbody tr:hover{background:#fafcff}.pill{border-radius:12px;padding:4px 8px;font-size:10px;font-weight:800}.pill.online{background:#e8f7f1;color:var(--green)}.pill.offline{background:#eef1f5;color:#758197}.empty{padding:35px;text-align:center;color:var(--muted)}.error{padding:14px;border-radius:8px;background:#fff0f1;color:#b63945;margin-bottom:14px}
.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input,.toolbar select,.form input,.form select{border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:#fff;color:var(--ink)}.toolbar input{flex:1}.primary{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 15px;font-weight:700;cursor:pointer}.secondary{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 15px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px}.form .full{grid-column:1/-1}.form-actions{margin-top:18px;display:flex;gap:9px}.notice{font-size:12px;color:var(--muted);background:#f5f8ff;border-radius:8px;padding:11px;margin-bottom:15px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:720px){.sidebar{width:62px;padding:18px 7px}.brand{font-size:0;padding:0 11px 22px}.brand b{font-size:20px}.brand small,.sidebar button{font-size:0}.sidebar nav button{height:42px;padding:0;text-align:center}.sidebar nav button:before{content:"•";font-size:24px}.sidebar-footer{display:none}.main{padding:22px 15px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat-value{font-size:21px}.topbar{display:block}.top-actions{margin-top:13px}.form-grid{grid-template-columns:1fr}.form .full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">NORTHSTAR<b>•</b><small>Fleet intelligence</small></div>
  <nav>
    <button class="active" data-page="overview">◈ &nbsp; Overview</button>
    <button data-page="live">⌖ &nbsp; Live tracking</button>
    <button data-page="devices">▣ &nbsp; Devices</button>
    <button data-page="vehicles">▤ &nbsp; Vehicles</button>
    <button data-page="history">◷ &nbsp; Route history</button>
    <button data-page="geofences">⌑ &nbsp; Geofences</button>
    <button data-page="reports">▥ &nbsp; Reports</button>
  </nav>
  <div class="sidebar-footer"><div class="user"><span class="avatar">AD</span><span>Admin<br><small>Operations</small></span></div>Location data is encrypted in transit.</div>
</aside>
<main class="main" id="main"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js" onerror="this.remove()"></script>
<script>
const API_BASE = window.API_BASE || 'http://localhost:4000/api';
const main = document.getElementById('main');
let map; let markers = []; let devices = [];
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTime = value => value ? new Date(value).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : 'Never';
async function api(path, options) { const response = await fetch(API_BASE + path, {headers:{'Content-Type':'application/json'}, ...options}); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || 'Request failed'); return data; }
function shell(title, subtitle, content) { main.innerHTML = `<div class="topbar"><div><div class="eyebrow">Operations center</div><h1 class="title">${title}</h1><div class="sub">${subtitle}</div></div><div class="top-actions"><span class="live">System operational</span><button class="refresh" onclick="loadPage()">↻ Refresh</button></div></div>${content}`; }
function stat(label, value, meta, color='') { return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${color}">${value}</div><div class="stat-meta">${meta}</div></div>`; }
async function loadDevices() { devices = await api('/tracking/devices'); return devices; }
function mapPanel() { return `<div class="panel"><div class="panel-head"><h2>Live fleet map</h2><span class="panel-kicker">Auto-refreshing every 30 seconds</span></div><div class="map-wrap"><div id="map"></div><div class="map-legend"><span class="dot online"></span>Online &nbsp; <span class="dot offline"></span>Offline</div></div></div>`; }
function drawMap() { if (map) map.remove(); map = L.map('map').setView([40.744, -73.987], 13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map); markers = []; devices.filter(d => d.latitude && d.longitude).forEach(d => { const marker = L.marker([d.latitude,d.longitude]).addTo(map); marker.bindPopup(`<b>${escapeHtml(d.device_name)}</b><br>${escapeHtml(d.vehicle_number || 'Unassigned')}<br>${Number(d.speed_kph || 0).toFixed(1)} km/h<br><small>Updated ${formatTime(d.recorded_at)}</small>`); markers.push(marker); }); }
async function overview() { shell('Good morning, Admin', 'Here is what is happening across your fleet today.', '<div id="content"><div class="empty">Loading fleet telemetry…</div></div>'); try { const [s, list] = await Promise.all([api('/tracking/summary'), loadDevices()]); document.getElementById('content').innerHTML = `<div class="stats">${stat('Registered devices',s.total_devices,'All registered trackers','blue')}${stat('Online now',s.online_devices,'Updated in last 10 min','green')}${stat('Offline',s.offline_devices,'Needs attention','orange')}${stat('Active sessions',s.active_sessions,'Trips in progress')}${stat('Vehicles',s.total_vehicles,'Across your fleet')}${stat("Today's distance",`${Number(s.distance_today||0).toFixed(1)} km`,'Completed trips','blue')}</div><div class="grid">${mapPanel()}<div class="panel"><div class="panel-head"><h2>Fleet status</h2><span class="panel-kicker">${list.length} trackers</span></div><div class="device-list">${list.length ? list.map(deviceRow).join('') : '<div class="empty">No devices registered.</div>'}</div></div><div class="panel"><div class="panel-head"><h2>Activity volume</h2><span class="panel-kicker">Last 7 days</span></div><div class="chart"><i class="bar" style="height:34%"><span>Mon</span></i><i class="bar" style="height:53%"><span>Tue</span></i><i class="bar" style="height:48%"><span>Wed</span></i><i class="bar" style="height:76%"><span>Thu</span></i><i class="bar" style="height:61%"><span>Fri</span></i><i class="bar" style="height:88%"><span>Sat</span></i><i class="bar" style="height:67%"><span>Sun</span></i></div><div class="chart-caption"><span>Trips and location updates</span><b>Live telemetry</b></div></div></div>`; drawMap(); } catch (e) { document.getElementById('content').innerHTML = `<div class="error">${escapeHtml(e.message)}. Start the API and apply schema.sql to PostgreSQL.</div>`; } }
function deviceRow(d) { return `<div class="device"><div class="device-icon">⌖</div><div class="device-info"><div class="device-name">${escapeHtml(d.device_name)}</div><div class="device-sub">${escapeHtml(d.vehicle_number || 'Unassigned')} · ${Number(d.speed_kph||0).toFixed(1)} km/h</div></div><span class="status ${d.status}">${d.status}</span></div>`; }
async function live() { shell('Live tracking','Monitor authorized devices and their last known coordinates.',`<div id="content"><div class="empty">Loading map…</div></div>`); try { await loadDevices(); document.getElementById('content').innerHTML = `<div class="grid"><div class="wide">${mapPanel()}</div><div class="panel wide"><div class="panel-head"><h2>Authorized devices</h2><span class="panel-kicker">${devices.length} devices</span></div><div class="table-wrap">${deviceTable(devices)}</div></div></div>`; drawMap(); } catch(e) { document.getElementById('content').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`; } }
function deviceTable(list) { if (!list.length) return '<div class="empty">No devices registered.</div>'; return `<table><thead><tr><th>Device</th><th>Vehicle</th><th>Driver</th><th>Status</th><th>Last location</th><th>Updated</th></tr></thead><tbody>${list.map(d=>`<tr><td><b>${escapeHtml(d.device_name)}</b><br><small>${escapeHtml(d.device_id)}</small></td><td>${escapeHtml(d.vehicle_number||'—')}</td><td>${escapeHtml(d.driver_name||'—')}</td><td><span class="pill ${d.status}">${d.status}</span></td><td>${d.latitude ? `${Number(d.latitude).toFixed(5)}, ${Number(d.longitude).toFixed(5)}` : '—'}</td><td>${formatTime(d.recorded_at)}</td></tr>`).join('')}</tbody></table>`; }
async function devicesPage() { shell('Devices','Register trackers, assign vehicles and monitor device health.',`<div id="content"><div class="empty">Loading devices…</div></div>`); try { await loadDevices(); document.getElementById('content').innerHTML = `<div class="panel"><div class="toolbar"><input id="device-search" placeholder="Search device, vehicle or driver…" oninput="filterDevices(this.value)"><button class="primary" onclick="deviceForm()">+ Register device</button></div><div class="table-wrap" id="device-table">${deviceTable(devices)}</div></div>`; } catch(e) { document.getElementById('content').innerHTML=`<div class="error">${escapeHtml(e.message)}</div>`; } }
function filterDevices(q) { const x=q.toLowerCase(); document.getElementById('device-table').innerHTML=deviceTable(devices.filter(d=>[d.device_name,d.device_id,d.vehicle_number,d.driver_name].some(v=>String(v||'').toLowerCase().includes(x)))); }
function deviceForm() { document.getElementById('content').insertAdjacentHTML('afterbegin',`<div class="panel form" id="register-panel"><div class="panel-head"><h2>Register GPS tracker</h2><button class="secondary" onclick="document.getElementById('register-panel').remove()">Close</button></div><div class="notice">The mobile tracker posts authorized coordinates to <code>POST /api/tracking/locations</code>. Never accept unregistered device IDs.</div><div class="form-grid"><div><label>Device ID</label><input id="new-device-id" placeholder="TRK-2001"></div><div><label>Device name</label><input id="new-device-name" placeholder="Delivery van tracker"></div></div><div class="form-actions"><button class="primary" onclick="alert('Create the device record in your provisioning workflow before accepting GPS data.')">Save device</button></div></div>`); }
async function simplePage(title, subtitle, message) { shell(title,subtitle,`<div class="panel"><div class="notice">${message}</div><div class="empty">Use the tracking API to load authorized records from PostgreSQL. This view intentionally never fabricates GPS data.</div></div>`); }
function loadPage(page=document.querySelector('nav button.active')?.dataset.page || 'overview') { if(page==='overview') return overview(); if(page==='live') return live(); if(page==='devices') return devicesPage(); if(page==='vehicles') return simplePage('Vehicles','Manage fleet assignments and driver records.','Vehicle and driver records are stored in the <code>vehicles</code> table.'); if(page==='history') return simplePage('Route history','Review trips, distance and playback for permitted devices.','History is permission-scoped and served from <code>/api/tracking/history/:deviceId</code>.'); if(page==='geofences') return simplePage('Geofences','Create boundaries and review entry and exit alerts.','Geofence boundaries and event history are represented by the <code>geofences</code> and <code>geofence_events</code> tables.'); return simplePage('Reports','Export operational history for a selected period.','Report endpoints can query the indexed location history without exposing unauthorized devices.'); }
document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));button.classList.add('active');loadPage(button.dataset.page);}));
loadPage();
setInterval(()=>{ if(document.querySelector('nav button.active')?.dataset.page==='overview') overview(); },30000);
</script>
</body>
</html>
